# ============================================================
# Kavian — Nginx Error Pages Configuration
# ============================================================
# این فایل را داخل بلوک server {} در nginx.conf یا vhost خود paste کنید.
# مثال مسیر: /etc/nginx/sites-available/kavian.conf
# ============================================================

# ── Custom Error Pages ───────────────────────────────────────
error_page 400 /Kavian/errors/400.php;
error_page 401 /Kavian/errors/401.php;
error_page 403 /Kavian/errors/403.php;
error_page 404 /Kavian/errors/404.php;
error_page 429 /Kavian/errors/429.php;
error_page 500 /Kavian/errors/500.php;
error_page 502 /Kavian/errors/502.php;
error_page 503 /Kavian/errors/503.php;
error_page 504 /Kavian/errors/504.php;

# ── پردازش PHP برای صفحات خطا ────────────────────────────────
location ~ ^/Kavian/errors/[0-9]+\.php$ {
    internal;
    fastcgi_pass unix:/run/php-fpm/php-fpm.sock;   # مسیر را با سرور خود تطبیق دهید
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
}

# ── مسدود کردن دسترسی مستقیم به پوشه app ─────────────────────
location ~ ^/Kavian/app/ {
    return 403;
}

# ── مسدود کردن فایل‌های حساس ─────────────────────────────────
location ~* \.(sql|log|env|bak|sh)$ {
    return 403;
}
